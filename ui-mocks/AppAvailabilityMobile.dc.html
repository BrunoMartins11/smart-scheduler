<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>App · Disponibilidade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:#0e7490}
button:focus-visible,a:focus-visible{outline:2px solid #0e7490;outline-offset:2px}
.on-dark:focus-visible{outline:2px solid #67e8f9;outline-offset:2px}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.shift-btn:hover{filter:brightness(.98)}
.btn-secondary:hover{background:#f8fafc}
</style>
</helmet>
<div style="width: 390px; min-height: 1080px; box-sizing: border-box; background: #f8fafc; color: #0f172a; font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 24px; padding-bottom: 24px;">

  <!-- Band: logo, name and compact Sair (no nav for members). Stars are sparse. -->
  <section style="position: relative; overflow: hidden; background: #1e1b4b; color: #ffffff;">
    <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%;" viewBox="0 0 390 300" preserveAspectRatio="xMidYMin slice">
      <circle cx="40" cy="36" r="1.2" fill="#ffffff" opacity=".5"></circle>
      <circle cx="120" cy="20" r="1" fill="#ffffff" opacity=".4"></circle>
      <circle cx="210" cy="60" r="1.2" fill="#ffffff" opacity=".3"></circle>
      <circle cx="300" cy="28" r="1.5" fill="#ffffff" opacity=".5"></circle>
      <circle cx="350" cy="110" r="1" fill="#ffffff" opacity=".35"></circle>
      <circle cx="70" cy="150" r="1" fill="#ffffff" opacity=".3"></circle>
      <circle cx="260" cy="190" r="1" fill="#ffffff" opacity=".3"></circle>
    </svg>

    <header style="position: relative; padding: 16px 16px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; line-height: 28px;">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><rect x="0" y="0" width="24" height="24" rx="6" fill="#0e7490"></rect><g transform="translate(3.5 3.5) scale(0.66)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="m9 16 2 2 4-4"></path></g></svg>
        <span>Smart Scheduler</span>
      </div>
      <button type="button" aria-label="Sair" title="Sair" class="btn-ghost on-dark" style="width: 44px; height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; background: transparent; color: #ffffff; cursor: pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
    </header>

    <div style="position: relative; padding: 24px 16px 64px; box-sizing: border-box;">
      <h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #ffffff;">01/11/2026 – 30/11/2026</h1>
      <p style="margin: 12px 0 0; display: flex; align-items: flex-start; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 700; color: #fcd34d;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg><span>Prazo de entrega: seg., 9 nov., 18:00 (amanhã)</span></p>
    </div>
  </section>

  <!-- Overlapping card: sticky brush bar, then the day rows. First card, so it has the shadow. -->
  <section aria-label="Disponibilidade" style="position: relative; margin: -48px 16px 0; box-sizing: border-box; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 30px rgba(30,27,75,.12);">

    <!-- Sticky on scroll (top: 0). Brush: aria-pressed marks the mark being applied. -->
    <div style="position: sticky; top: 0; z-index: 10; background: #ffffff; padding: 16px 16px 12px; border-bottom: 1px solid #e2e8f0; border-radius: 12px 12px 0 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #475569;">1. Escolha a marca. 2. Toque nos turnos.</p>
      <div role="group" aria-label="Marca a aplicar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button type="button" aria-pressed="true" style="min-height: 44px; width: 100%; padding: 6px 8px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #059669; border-radius: 6px; background: #ecfdf5; color: #065f46; font: inherit; font-weight: 700; cursor: pointer;">Disponível</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; width: 100%; padding: 6px 8px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #64748b; border-radius: 6px; background: #ffffff; color: #475569; font: inherit; font-weight: 700; cursor: pointer;">Se necessário</button>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #475569;">4 disponível · 2 se necessário. Turnos sem marca contam como indisponível.</p>
      <p role="status" style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #155e75;">Guardado</p>
    </div>

    <div style="padding: 0 16px 16px;">
      <button type="button" style="margin-top: 12px; width: 100%; min-height: 44px; padding: 0 16px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; color: #0f172a; font: inherit; font-weight: 700; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>Todas as noites</button>

      <!-- Day rows. Each shift is a button with a 44 px target; the state uses the availability recipes (availYes, availIf, availNone). -->
      <sc-for list="{{days}}" as="day" hint-placeholder-count="5">
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e2e8f0;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">{{day.label}}</h3>
            <button type="button" aria-label="Dia e noite {{day.label}}" style="min-height: 44px; padding: 0 12px; box-sizing: border-box; display: inline-flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; color: #0f172a; font: inherit; font-weight: 700; cursor: pointer;">Dia e noite</button>
          </div>
          <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{day.shifts}}" as="s" hint-placeholder-count="2">
              <button type="button" aria-label="{{s.aria}}" class="shift-btn" style="min-height: 44px; width: 100%; padding: 6px 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid {{s.border}}; border-radius: 6px; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-weight: 700; cursor: pointer;">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 20px;">
                  <sc-if value="{{s.isAvail}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                  <sc-if value="{{s.isIf}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg></sc-if>
                  <span>{{s.name}}</span>
                  <sc-if value="{{s.night}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
                </span>
                <span style="font-size: 14px; line-height: 20px; font-weight: 400; font-variant-numeric: tabular-nums;">{{s.time}}</span>
                <sc-if value="{{s.byManager}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; font-weight: 400;">Pelo gestor</span></sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // Shift states from ui.ts: availYes, availIf, availNone. Mix of marks on five days.
    const look = {
      available: { border: '#059669', bg: '#ecfdf5', fg: '#065f46', word: 'Disponível' },
      ifNeeded: { border: '#f59e0b', bg: '#fffbeb', fg: '#92400e', word: 'Se necessário' },
      none: { border: '#64748b', bg: '#ffffff', fg: '#475569', word: 'Não disponível' }
    };
    const week = [
      { label: 'seg. 09/11', date: '09/11/2026', shifts: [['Urgência', '08:00–20:00', 'available'], ['Noite', '20:00–08:00', 'ifNeeded']] },
      { label: 'ter. 10/11', date: '10/11/2026', shifts: [['Urgência', '08:00–20:00', 'none'], ['Noite', '20:00–08:00', 'available']] },
      { label: 'qua. 11/11', date: '11/11/2026', shifts: [['Urgência', '08:00–20:00', 'ifNeeded'], ['Noite', '20:00–08:00', 'none']] },
      { label: 'qui. 12/11', date: '12/11/2026', shifts: [['Urgência', '08:00–20:00', 'available', true], ['Noite', '20:00–08:00', 'available']] },
      { label: 'sex. 13/11', date: '13/11/2026', shifts: [['Urgência', '08:00–20:00', 'none'], ['Noite', '20:00–08:00', 'none']] }
    ];
    const days = week.map((d) => ({
      label: d.label,
      shifts: d.shifts.map(([name, time, state, byManager]) => {
        const l = look[state];
        const night = name === 'Noite';
        return {
          name: name,
          time: time,
          night: night,
          aria: name + ' ' + d.date + ': ' + l.word + (byManager ? ', introduzido pelo gestor' : ''),
          border: l.border,
          bg: l.bg,
          fg: l.fg,
          isAvail: state === 'available',
          isIf: state === 'ifNeeded',
          byManager: !!byManager
        };
      })
    }));
    return { days: days };
  }
}
</script>
</body>
</html>
