<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My shifts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:#0e7490}a:hover{color:#155e75}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #0f172a; font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; overflow: hidden;">
  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">My shifts</h1>
    <span style="color: #475569;">November · 14 shifts</span>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 24px;">
    <section style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{shifts}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0;">
          <span style="width: 40px; height: 40px; border-radius: 8px; background: {{s.bg}}; color: {{s.fg}}; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{s.code}}</span>
          <div style="display: flex; flex-direction: column;">
            <span style="font-weight: 700;">{{s.date}}</span>
            <span style="color: #475569;">{{s.time}}</span>
          </div>
        </div>
      </sc-for>
      <a href="#" style="align-self: flex-start; padding: 8px 0; font-weight: 700;">See all shifts</a>
    </section>

    <section style="border-top: 1px solid #e2e8f0; padding-top: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700;">Your share</h2>
        <span style="color: #15803d; font-weight: 700;">In line with the team</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">168 h</span>
          <span style="color: #475569; font-size: 12px;">Hours · team 168</span>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">7</span>
          <span style="color: #475569; font-size: 12px;">Nights · team 7.5</span>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums;">1</span>
          <span style="color: #475569; font-size: 12px;">"If needed" used · team 1.5</span>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const day = { code: 'D', bg: '#fef3c7', fg: '#78350f' };
    const night = { code: 'N', bg: '#e0e7ff', fg: '#312e81' };
    const shifts = [
      Object.assign({ date: 'Mon 2 Nov', time: '08:00 – 20:00' }, day),
      Object.assign({ date: 'Tue 3 Nov', time: '08:00 – 20:00' }, day),
      Object.assign({ date: 'Wed 4 Nov', time: '20:00 – 08:00' }, night),
      Object.assign({ date: 'Thu 5 Nov', time: '20:00 – 08:00' }, night)
    ];
    return { shifts: shifts };
  }
}
</script>
</body>
</html>
